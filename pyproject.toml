[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crispra-screen"
version = "1.0.0"
description = "QC and hypergeometric gene scoring for a px52-amplified CRISPR-activation screen"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Tran lab"}]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "requests>=2.28",
]

[project.scripts]
crispra-screen = "crispra_screen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crispra_screen = ["data/*.csv"]
